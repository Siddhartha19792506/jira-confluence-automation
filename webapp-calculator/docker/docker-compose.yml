services:
  db:
    image: postgres:15
    container_name: jca-postgres
    environment:
      POSTGRES_DB: jca
      POSTGRES_USER: jca_user
      POSTGRES_PASSWORD: jca_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jca_user -d jca"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - jca_pgdata:/var/lib/postgresql/data

volumes:
  jca_pgdata:
